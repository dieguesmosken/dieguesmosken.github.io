<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projetos</title>
    <link rel="stylesheet" href="./styles/style.css">
    <link rel="stylesheet" href="./styles/projects.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />

</head>

<body>
    <header class="cabecalho">
        <nav class="cabecalho__menu">
            <a class="cabecalho__menu__link" href="index.html">Home</a>
            <a class="cabecalho__menu__link" href="about.html">Sobre mim</a>
            <a class="cabecalho__menu__link" href="projects.html">Projetos</a>
            <a class="cabecalho__menu__link" href="posts.html">Posts</a>
        </nav>
    </header>

    <main class="apresentacao">
        <section class="apresentacao__conteudo">
            <h1 class="apresentacao__conteudo__titulo">Projetos</h1>

            <!-- Seus outros projetos -->
            <h2 class="apresentacao__links__subtitulo">Challenges Alura</h2>
            <a class="apresentacao__links__navegacao" href="https://dieguesmosken.github.io/challanges-alura-oracle-ONE-T6/challange-01/index.html">
                <i class="apresentacao__icone fas fa-code"></i>
                Codificador e Decodificador de Texto
            </a>

            <!-- Novo botão para o projeto de Encurtador de Links -->
            <h2 class="apresentacao__links__subtitulo">Visualizar Meus Projetos</h2>
            <a class="apresentacao__links__navegacao botao" href="https://www.teuzin.com.br/redirect/">
                <i class="apresentacao__icone fas fa-link"></i>
               Encurtador de Links
            </a>
            <a class="apresentacao__links__navegacao botao" href="https://www.teuzin.com.br/WeatherApp/">
                <i class=" apresentacao__icone fas fa-cloud-sun"></i>
               Previsão do Tempo
            </a>

            <!-- Seção para exibir projetos do GitHub -->
            <h2 class="apresentacao__links__subtitulo">Repositorios Publicos do Meu Github</h2>
            <div id="github-projects" class="apresentacao__links github-projects-cards">
                <!-- Os projetos do GitHub serão inseridos aqui pelo JavaScript -->
            </div>

            <!-- Modal para detalhes do projeto -->
            <div id="project-modal" class="project-modal" style="display:none;">
                <div class="project-modal-content">
                    <span class="project-modal-close" id="close-modal">&times;</span>
                    <div id="modal-details"></div>
                </div>
            </div>
        </section>
    </main>

    <footer class="rodape">
        <p>Desenvolvido por @dieguesmosken.</p>
    </footer>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/js/all.js" integrity="sha512-Nxw1drpjN57DlFRzn8h+RaS7dTjhPOlHftsKYGRkCEj1lEbx3k1bqNz1qvLpRkEF19qe7YSHppCdnLc8FUmfnQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script>
        // Função para carregar os projetos do GitHub
        fetch('https://api.github.com/users/dieguesmosken/repos?sort=pushed')
            .then(response => response.json())
            .then(data => {
                const projectContainer = document.getElementById('github-projects');
                projectContainer.innerHTML = '';
                data.forEach(project => {
                    const card = document.createElement('div');
                    card.className = 'github-project-card';
                    card.innerHTML = `
                        <div class="github-project-header">
                            <a href="${project.html_url}" target="_blank" class="github-project-title" onclick="event.stopPropagation()">
                                <i class="apresentacao__icone fa-brands fa-github"></i> ${project.name}
                            </a>
                        </div>
                        <div class="github-project-desc">${project.description ? project.description : 'Sem descrição.'}</div>
                        <div class="github-project-info">
                            <span class="github-project-lang">${project.language ? project.language : 'N/A'}</span>
                            <span title="Estrelas"><i class="fa fa-star"></i> ${project.stargazers_count}</span>
                            <span title="Forks"><i class="fa fa-code-fork"></i> ${project.forks_count}</span>
                        </div>
                    `;
                    card.addEventListener('click', function() {
                        showProjectModal(project);
                    });
                    projectContainer.appendChild(card);
                });
            })
            .catch(error => console.error('Erro ao carregar os projetos do GitHub:', error));

        // Função para mostrar o modal com detalhes do projeto
        function showProjectModal(project) {
            const modal = document.getElementById('project-modal');
            const details = document.getElementById('modal-details');
            details.innerHTML = `
                <h2>${project.name}</h2>
                <p><strong>Descrição:</strong> ${project.description ? project.description : 'Sem descrição.'}</p>
                <p><strong>Linguagem:</strong> ${project.language ? project.language : 'N/A'}</p>
                <p><strong>Estrelas:</strong> ${project.stargazers_count}</p>
                <p><strong>Forks:</strong> ${project.forks_count}</p>
                <p><strong>Criado em:</strong> ${new Date(project.created_at).toLocaleDateString()}</p>
                <p><strong>Última atualização:</strong> ${new Date(project.updated_at).toLocaleDateString()}</p>
                <p><a href="${project.html_url}" target="_blank">Ver no GitHub</a></p>
            `;
            modal.style.display = 'block';
        }
        // Fechar modal ao clicar no X
        document.getElementById('close-modal').onclick = function() {
            document.getElementById('project-modal').style.display = 'none';
        };
        // Fechar modal ao clicar fora do conteúdo
        window.onclick = function(event) {
            const modal = document.getElementById('project-modal');
            if (event.target === modal) {
                modal.style.display = 'none';
            }
        };
    </script>
</body>

</html>
